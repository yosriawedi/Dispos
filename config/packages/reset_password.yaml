symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository

# No mail transport is configured locally (MAILER_DSN=null://null), so testing the
# flow means requesting a reset repeatedly by hand — the 1h default throttle makes
# that painful in dev only.
when@dev:
    symfonycasts_reset_password:
        throttle_limit: 60
